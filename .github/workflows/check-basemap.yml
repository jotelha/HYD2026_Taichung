name: Check basemap

# Opens the Boba Index map (index.html) in headless Chromium and checks that the English vector basemap
# (OpenFreeMap + MapLibre) loads, lines up with the overlay and labels in English.
# Screenshots of the three themes are attached to the run as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Check the map page
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node scripts/check_basemap.mjs http://localhost:8000/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basemap-screenshots
          path: check-basemap/
          if-no-files-found: ignore

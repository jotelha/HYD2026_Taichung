name: Fetch OSM road network

# Pulls roads and rail for the study area, plus the named landmarks used to
# place the major projects, from the Overpass API; rebuilds the site and
# commits the result. Run it by hand (Actions tab > Run workflow)
# whenever the road layer should be refreshed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-roads
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch roads from Overpass
        run: python3 scripts/fetch_roads.py

      - name: Fetch project landmarks from Overpass
        run: python3 scripts/fetch_landmarks.py

      - name: Fetch garbage bins from Overpass
        run: python3 scripts/fetch_bins.py

      - name: Fetch convenience stores from Overpass
        run: python3 scripts/fetch_stores.py

      - name: Fetch pharmacies from Overpass
        run: python3 scripts/fetch_pharmacies.py

      - name: Place major projects
        run: python3 scripts/locate_projects.py

      - name: Rebuild site
        run: python3 scripts/build_map.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/roads_osm.geojson data/derived/landmarks_osm.geojson data/derived/waste_bins_osm.geojson data/derived/convenience_stores_osm.geojson data/derived/pharmacies_osm.geojson data/derived/project_locations.geojson index.html map/index.html
          if git diff --cached --quiet; then
            echo "Road data unchanged."
            exit 0
          fi
          git commit -m "Update OSM road network and landmarks ($(date -u +%Y-%m-%d))"
          git push
